name: statuspulse

services:
  app:
    image: statuspulse:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${STATUSPULSE_PORT:-8080}:8080"
    environment:
      STATUSPULSE_ADDR: ":8080"
      STATUSPULSE_DB_PATH: "/data/statuspulse.db"
      STATUSPULSE_CHECK_INTERVAL: "${STATUSPULSE_CHECK_INTERVAL:-1m}"
      STATUSPULSE_REQUEST_TIMEOUT: "${STATUSPULSE_REQUEST_TIMEOUT:-5s}"
    volumes:
      - statuspulse-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  statuspulse-data:
